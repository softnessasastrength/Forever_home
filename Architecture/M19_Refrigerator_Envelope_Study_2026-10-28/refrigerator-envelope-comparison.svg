<text x='32' y='708' class='note'>Muted blue = appliance body; dashed terracotta = manufacturer 90 degree depth envelope. This is a side projection, not the true door-swing footprint.</text>
<text x='32' y='731' class='note'>Neither candidate passes the documented 42 in closed aisle in this north-run position. Exact current model, alcove and door-swing geometry remain an owner/design gate.</text>
