<rect x='40' y='134' width='108' height='72' class='counter'/><text x='44' y='170' class='label'>24 in counter-depth zone</text>
<rect x='44.875' y='134' width='98.25' height='99' class='fridge'/><text x='42' y='249' class='label'>closed appliance + 2 in rear clearance</text>
<line x1='36' y1='350' x2='152' y2='350' class='island'/><text x='40' y='367' class='label'>island front / 72 in from datum</text>
<text x='46' y='390.5' class='fail'>remaining: 39 in</text>
<line x1='571' y1='134' x2='687' y2='134' class='wall'/><text x='575' y='127' class='label'>back-of-appliance datum</text>
<rect x='575' y='134' width='108' height='72' class='counter'/><text x='579' y='170' class='label'>24 in counter-depth zone</text>
