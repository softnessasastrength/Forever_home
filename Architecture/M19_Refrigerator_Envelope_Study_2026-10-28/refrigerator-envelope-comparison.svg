<line x1='571' y1='350' x2='687' y2='350' class='island'/><text x='575' y='367' class='label'>island front / 72 in from datum</text>
<text x='581' y='440' class='fail'>remaining: 28 in</text>
<text x='40' y='366' class='head'>GZS22IMNES - closed: 39.25 in aisle</text>
<text x='575' y='366' class='head'>GZS22IMNES - open at 90 degrees: 23.5 in aisle</text>
<line x1='36' y1='384' x2='152' y2='384' class='wall'/><text x='40' y='377' class='label'>back-of-appliance datum</text>
<rect x='40' y='384' width='108' height='72' class='counter'/><text x='44' y='420' class='label'>24 in counter-depth zone</text>
<rect x='40.375' y='384' width='107.25' height='98.25' class='fridge'/><text x='42' y='498.25' class='label'>closed appliance + 2 in rear clearance</text>
<line x1='36' y1='600' x2='152' y2='600' class='island'/><text x='40' y='617' class='label'>island front / 72 in from datum</text>
<text x='46' y='639.375' class='fail'>remaining: 39.25 in</text>
<line x1='571' y1='384' x2='687' y2='384' class='wall'/><text x='575' y='377' class='label'>back-of-appliance datum</text>
<rect x='575' y='384' width='108' height='72' class='counter'/><text x='579' y='420' class='label'>24 in counter-depth zone</text>
<rect x='575.375' y='384' width='107.25' height='98.25' class='fridge'/><rect x='575.375' y='384' width='107.25' height='145.5' class='open'/><text x='577' y='545.5' class='label'>90 degree open depth + 2 in rear clearance</text>
