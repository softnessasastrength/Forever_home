<text class="small" x="40" y="415">Green: U-01/U-04 touch a test-shell edge. Red: U-03 is internal, with no perimeter wall segment in this packing.</text>
<text class="small" x="40" y="440">R310.1 requires an opening in every sleeping room, opening directly to a public way or qualifying yard/court.</text>
<text class="small" x="40" y="465">No actual exterior wall/opening is modeled. U-03 status and any roof-opening approach remain unresolved.</text>
