<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600">
<style>text{font-family:Arial,sans-serif;fill:#302b25}.title{font-size:21px;font-weight:bold}.label{font-size:13px}.note{font-size:12px;fill:#5b554d}.axis{stroke:#74695d;stroke-width:2}.a{fill:#7f9d84}.b{fill:#b78f66}</style>
<text class="title" x="40" y="32">M38 - steep-gable rise options</text><text class="note" x="40" y="54">Illustrative pitch cases on the 40 x 42 ft test envelope; eave datum and pitch unselected</text><text class="note" x="40" y="74">Bars show rise; labels add two-plane geometric area versus the 1,680 sf projected test footprint.</text>
<text class="label" x="40" y="124">A / 8:12</text><rect class="a" x="180" y="102" width="133.333333333333" height="24"/><text class="label" x="400" y="124">13.33 ft rise; 2,019 sf planes (+20.2%)</text>
<text class="label" x="40" y="166">A / 10:12</text><rect class="a" x="180" y="144" width="166.666666666667" height="24"/><text class="label" x="400" y="166">16.67 ft rise; 2,187 sf planes (+30.2%)</text>
<text class="label" x="40" y="208">A / 12:12</text><rect class="a" x="180" y="186" width="200" height="24"/><text class="label" x="400" y="208">20.00 ft rise; 2,376 sf planes (+41.4%)</text>
<text class="label" x="40" y="304">B / 8:12</text><rect class="b" x="180" y="282" width="140" height="24"/><text class="label" x="400" y="304">14.00 ft rise; 2,019 sf planes (+20.2%)</text>
<text class="label" x="40" y="346">B / 10:12</text><rect class="b" x="180" y="324" width="175" height="24"/><text class="label" x="400" y="346">17.50 ft rise; 2,187 sf planes (+30.2%)</text>
<text class="label" x="40" y="388">B / 12:12</text><rect class="b" x="180" y="366" width="210" height="24"/><text class="label" x="400" y="388">21.00 ft rise; 2,376 sf planes (+41.4%)</text>
<line class="axis" x1="180" y1="455" x2="390" y2="455"/>
<text class="note" x="40" y="520">A: ridge along 42 ft side, 20 ft half-run. B: ridge along 40 ft side, 21 ft half-run.</text><text class="note" x="40" y="542">Plane area excludes overhangs, gables, dormers, intersections, openings, waste and assemblies.</text><text class="note" x="40" y="564">Geometric comparison only; it is not a roofing takeoff, cost estimate, roof solid or code/structural review.</text>
</svg>
