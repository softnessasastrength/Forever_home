<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="980" viewBox="0 0 1180 980">
<title>West A hypothetical same-wall M-06 fixture envelope comparison</title>
<desc>Two labeled rectangular envelope examples inside unassigned west A. Neither fixture pair is selected or installed. The front-depth screen is a planning proxy only.</desc>
<rect width="1180" height="980" fill="#fbfaf7"/>
<style>text{font-family:Segoe UI,Arial,sans-serif;fill:#262626}.title{font-size:25px;font-weight:700}.subtitle{font-size:14px}.paneltitle{font-size:16px;font-weight:700}.label{font-size:12px}.small{font-size:11px}.dimension{stroke:#4b5563;stroke-width:1.4;fill:none}.boundary{stroke:#1f2937;stroke-width:2;fill:#fff}.toilet{fill:#cfe8f3;stroke:#216b8c;stroke-width:2}.sink{fill:#e8d8bd;stroke:#805d32;stroke-width:2}.centerline{stroke:#6b7280;stroke-width:1;stroke-dasharray:5 4}.frontline{stroke:#b45309;stroke-width:1.5;stroke-dasharray:7 5}</style>
<text x="50" y="44" class="title">M-06 west A - same-wall envelope examples</text>
<text x="50" y="70" class="subtitle">62 x 137 in gross search window; candidate rectangles use the M230 assumptions. No room is assigned.</text>
<text x="85" y="112" class="paneltitle">Example: KOHLER Tresham K-2844-4-0 - unselected</text>
<text x="85" y="132" class="small">Sink plan envelope 24 x 19.5 in (Tresham candidate)</text>
<rect x="85" y="150" width="310" height="685" class="boundary"/>
<line x1="160" y1="150" x2="160" y2="835" class="centerline"/>
