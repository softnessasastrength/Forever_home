<text x="255" y="184" class="small">Sink</text>
<line x1="85" y1="406.25" x2="395" y2="406.25" class="frontline"/>
<text x="89" y="400.25" class="small">51.25 in body + front-strip depth screen</text>
<line x1="85" y1="859" x2="395" y2="859" class="dimension"/>
<text x="215" y="878" class="label">62 in gross width</text>
<text x="85" y="902" class="label">Screen width used: 57 in; gross remainder: 5 in</text>
