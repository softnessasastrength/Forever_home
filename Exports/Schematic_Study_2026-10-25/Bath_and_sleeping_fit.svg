<line x1="87.0" y1="260" x2="206" y2="260" stroke="#aa602c" stroke-width="5" stroke-dasharray=""/>
<rect x="87.0" y="141.0" width="119.0" height="119.0" fill="none" stroke="#aa602c" stroke-width="1.5" stroke-dasharray="5 4"/>
