<text x="75.1" y="520.1" class="small" text-anchor="start">Shower</text>
<rect x="299.5" y="506.5" width="51.0" height="85.0" fill="#d4dfcf" stroke="#53634f" stroke-width="1.5" stroke-dasharray=""/>
<text x="304.6" y="528.6" class="small" text-anchor="start">Toilet</text>
<circle cx="206" cy="413.0" r="85.0" fill="none" stroke="#2f776d" stroke-dasharray="6 4"/>
