<text x="35" y="38" class="title" text-anchor="start">Main full bath + flex sleeping room | Nominal fit studies</text>
<text x="35" y="64" class="small" text-anchor="start">PROPOSALS - a five-foot circle and nominal openings do not establish a complete accessible design.</text>
