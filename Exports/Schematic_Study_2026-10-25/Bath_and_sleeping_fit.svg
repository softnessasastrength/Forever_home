<rect x="667.0" y="356.322" width="170" height="226.678" fill="#d6c3a3" stroke="#53634f" stroke-width="1.5" stroke-dasharray=""/>
<text x="673.8" y="464" class="small" text-anchor="start">5 x 6.667 ft</text>
<text x="673.8" y="481" class="small" text-anchor="start">bed footprint</text>
<circle cx="930.5" cy="447.0" r="85.0" fill="none" stroke="#2f776d" stroke-dasharray="6 4"/>
<line x1="854" y1="260" x2="973.0" y2="260" stroke="#aa602c" stroke-width="5" stroke-dasharray=""/>
<text x="650" y="240" class="room" text-anchor="start">11 x 10 ft flex bedroom-capable room</text>
<text x="70" y="680" class="room" text-anchor="start">Main bath is 9 x 10 ft in BOTH studies; B brings L-02 to the same main level.</text>
<text x="70" y="697" class="room" text-anchor="start">Shower 5 x 3 ft, vanity 5 x 1.833 ft, toilet footprint 1.5 x 2.5 ft are schematic inputs.</text>
<text x="70" y="714" class="room" text-anchor="start">Toilet transfer zones, shower approach, door hardware/clear opening, waterproofing, reinforcement and controls remain unresolved.</text>
<text x="70" y="731" class="room" text-anchor="start">B sleeping room opens from the dining-side passage: privacy/acoustics require refinement. No legal-bedroom or accessibility certification.</text>
</svg>