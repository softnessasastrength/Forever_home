<text x="35" y="38" class="title" text-anchor="start">Option B | Coordinated volume section</text>
<text x="35" y="64" class="small" text-anchor="start">Longitudinal shell section and separate stair arithmetic diagram; roof / foundation / grade are unresolved.</text>
