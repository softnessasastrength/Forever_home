<text x="81" y="295" class="room" text-anchor="start">MAIN 0 ft</text>
<text x="81" y="312" class="room" text-anchor="start">9 ft ceiling study</text>
<text x="627" y="193" class="room" text-anchor="start">UPPER +5 ft</text>
<text x="627" y="210" class="room" text-anchor="start">9 ft ceiling study</text>
<text x="627" y="380" class="room" text-anchor="start">LOWER -5 ft</text>
<text x="627" y="397" class="room" text-anchor="start">8.75 ft clear height</text>
<text x="55" y="490" class="room" text-anchor="start">Lower-to-upper: 10.00 ft = 8.75 ft clear + 1.25 ft assumed assembly.</text>
<text x="55" y="519" class="room" text-anchor="start">Each half flight: 8 risers x 7.5000 in = 60.0 in; 7 treads x 11 in = 6.417 ft run.</text>
<text x="55" y="548" class="room" text-anchor="start">Flight reservation: 4 ft wide; 4 ft landings at both ends. Total straight plan length: 14.417 ft.</text>
<text x="55" y="590" class="room" text-anchor="start">Section logic: main and lower/upper rooms occupy different plan zones. The stair/lift core joins the zones.</text>
<text x="55" y="607" class="room" text-anchor="start">Core slab openings, floor edges, beams, pit/overrun and headroom are not resolved by this volume diagram.</text>
<text x="55" y="624" class="room" text-anchor="start">A reserves a future lift-dependent sleeping route; B provides a proposed main-level sleeping/bathing route.</text>
<text x="55" y="641" class="room" text-anchor="start">No grade line or roof pitch is drawn because site and roof/solar coordination are not selected.</text>
</svg>