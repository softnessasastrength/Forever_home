<text x="35" y="38" class="title" text-anchor="start">Option A | Coordinated volume section</text>
<text x="35" y="64" class="small" text-anchor="start">Longitudinal shell section and separate stair arithmetic diagram; roof / foundation / grade are unresolved.</text>
<rect x="55" y="227" width="468" height="153" fill="#edf0e5" stroke="#53634f" stroke-width="1.5" stroke-dasharray=""/>
<rect x="523" y="150.5" width="416" height="153" fill="#f3e9d8" stroke="#53634f" stroke-width="1.5" stroke-dasharray=""/>
<rect x="523" y="320.5" width="416" height="136.0" fill="#e3ecea" stroke="#53634f" stroke-width="1.5" stroke-dasharray=""/>
<rect x="523" y="303.5" width="416" height="17" fill="#bfb4a4" stroke="#53634f" stroke-width="1.5" stroke-dasharray=""/>
<line x1="55" y1="380" x2="523" y2="380" stroke="#29372d" stroke-width="3" stroke-dasharray=""/>
<line x1="523" y1="456.5" x2="939" y2="456.5" stroke="#29372d" stroke-width="3" stroke-dasharray=""/>
<line x1="523" y1="303.5" x2="939" y2="303.5" stroke="#29372d" stroke-width="3" stroke-dasharray=""/>
